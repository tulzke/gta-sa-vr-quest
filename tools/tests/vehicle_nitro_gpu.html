<!doctype html><meta charset="utf-8">
<style>body{background:#19222c;color:#eee;font:15px sans-serif}canvas{margin:5px}pre{white-space:pre-wrap}</style>
<pre id="result">RUNNING</pre><div id="images"></div>
<script>
const vs=__VS__,shaders=__SHADERS__,W=320,H=240;
try{
 const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
 const gl=canvas.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true});if(!gl)throw Error('WebGL2 unavailable');
 function shader(type,s){const v=gl.createShader(type);gl.shaderSource(v,s);gl.compileShader(v);if(!gl.getShaderParameter(v,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(v));return v;}
 function program(fs){const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,vs));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p;}
 const data=new Uint8Array(W*H*4);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const light=((x>>2)+(y>>2))%2===0,road=Math.abs(x-W/2)<18;
  data.set(road?[90,100,115,255]:light?[215,192,145,255]:[30,58,82,255],(y*W+x)*4);
 }
 const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,W,H,0,gl.RGBA,gl.UNSIGNED_BYTE,data);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 gl.bindVertexArray(gl.createVertexArray());gl.viewport(0,0,W,H);gl.disable(gl.DITHER);
 function draw(p,strength,cx,grade){gl.useProgram(p);const u=n=>gl.getUniformLocation(p,n);
  gl.uniform1i(u('uTexture'),0);gl.uniform2f(u('uInverseSourceSize'),1/W,1/H);gl.uniform3f(u('uNitro'),strength,cx,.5);
  gl.uniform1f(u('uUnderwater'),grade?.6:0);gl.uniform1f(u('uWaterDepth'),grade?2:0);gl.uniform1i(u('uMobileColorMode'),grade?1:0);
  gl.uniform3f(u('uContrastMult'),1.1,.95,.9);gl.uniform3f(u('uContrastAdd'),.01,.02,.03);gl.drawArrays(gl.TRIANGLES,0,3);
  const pixels=new Uint8Array(W*H*4);gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,pixels);return pixels;}
 function image(pixels,title){const c=document.createElement('canvas');c.width=W;c.height=H;c.title=title;const ctx=c.getContext('2d');const img=ctx.createImageData(W,H);
  for(let y=0;y<H;y++)img.data.set(pixels.subarray(y*W*4,(y+1)*W*4),(H-y-1)*W*4);ctx.putImageData(img,0,0);images.append(c);}
 let checks=0;
 for(let i=0;i<shaders.length;i++){
  const p=program(shaders[i]);
  for(const cx of [.42,.58])for(const grade of [false,true]){
   const off=draw(p,0,cx,grade),on=draw(p,1,cx,grade),otherOff=draw(p,0,1-cx,grade);
   let centreDiff=0,outerDiff=0,outerCount=0,midDiff=0,midCount=0;
   for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const radius=Math.hypot(((x+.5)/W-cx)*2,((y+.5)/H-.5)*2),k=(y*W+x)*4;
    for(let c=0;c<3;c++){
     if(off[k+c]!==otherOff[k+c])throw Error('OFF changed by blur optical centre');
     const d=Math.abs(off[k+c]-on[k+c]);
     if(radius<.16)centreDiff=Math.max(centreDiff,d);
     if(radius>.30&&radius<.50){midDiff+=d;midCount++;}
     if(radius>.85){outerDiff+=d;outerCount++;}
    }
   }
   if(centreDiff>1)throw Error('Centre softened: '+centreDiff);
   if(midDiff/midCount<5)throw Error('Blur coverage too narrow near centre: '+midDiff/midCount);
   if(outerDiff/outerCount<8)throw Error('Peripheral effect too weak: '+outerDiff/outerCount);
   if(gl.getError()!==gl.NO_ERROR)throw Error('GL error');checks++;
   if(cx===.42&&!grade){image(off,(i?'Copy':'FXAA')+' OFF');image(on,(i?'Copy':'FXAA')+' NITRO');images.append(document.createElement('br'));}
  }
 }
 result.textContent='PASS GPU: '+checks+' actual shader renders; FXAA/copy, sharp centres for both asymmetric eyes, peripheral blur, grading/water preserved, OFF identity';
}catch(e){result.textContent='FAIL GPU: '+e.message;throw e;}
</script>
